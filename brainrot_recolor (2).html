<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brainrot Texture Recolorer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e0e0f; --panel: #161618; --panel2: #1c1c1f; --border: #2a2a2e;
    --accent: #ff6a00; --accent2: #ffb347; --text: #f0ede8; --muted: #555;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Space Mono', monospace; min-height: 100vh; padding: 28px 24px; }
  h1 { font-family: 'Syne', sans-serif; font-size: 2rem; font-weight: 800; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 0.72rem; margin-bottom: 24px; }

  /* Top bar */
  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  #globalDropzone { flex: 1; border: 2px dashed var(--border); border-radius: 10px; padding: 20px; text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s; }
  #globalDropzone:hover, #globalDropzone.drag-over { border-color: var(--accent); background: rgba(255,106,0,0.05); }
  #globalDropzone strong { font-size: 0.85rem; }
  #globalDropzone p { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
  #fileInput { display: none; }

  .btn { padding: 11px 20px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; border-radius: 8px; color: #000; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 0.85rem; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: opacity 0.2s, transform 0.1s; white-space: nowrap; }
  .btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
  .btn-sm { padding: 6px 12px; font-size: 0.68rem; background: transparent; border: 1px solid var(--accent); color: var(--accent); font-family: 'Space Mono', monospace; border-radius: 6px; cursor: pointer; }
  .btn-sm:hover { background: rgba(255,106,0,0.1); }
  .btn-danger { border-color: #ff4444; color: #ff4444; }
  .btn-danger:hover { background: rgba(255,68,68,0.1); }

  /* Image cards */
  #imageCards { display: flex; flex-direction: column; gap: 20px; }

  .img-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .img-card-header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel2); }
  .img-card-header .fname { flex: 1; font-size: 0.75rem; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .img-card-body { display: grid; grid-template-columns: auto 1fr; gap: 0; }

  /* Image preview panel */
  .preview-panel { padding: 16px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; align-items: center; min-width: 220px; max-width: 280px; }
  .preview-panel canvas { border-radius: 6px; cursor: crosshair; image-rendering: pixelated; max-width: 240px; max-height: 240px; width: 100%; }
  .picked-color { display: flex; align-items: center; gap: 8px; font-size: 0.68rem; color: var(--muted); }
  .picked-swatch { width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--border); flex-shrink: 0; }
  .pick-hint { font-size: 0.62rem; color: var(--muted); text-align: center; }
  .zoom-box { width: 60px; height: 60px; border-radius: 6px; border: 2px solid var(--border); image-rendering: pixelated; background: #111; flex-shrink:0; }

  /* Swaps panel */
  .swaps-panel { padding: 16px; display: flex; flex-direction: column; gap: 12px; flex: 1; min-width: 0; }
  .swaps-panel h3 { font-family: 'Syne', sans-serif; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); }
  .swap-col-headers { display: flex; gap: 6px; font-size: 0.6rem; color: var(--muted); padding: 0 2px; align-items:center; }
  .sch-from { width: 36px; text-align:center; }
  .sch-arr  { width: 14px; }
  .sch-to   { width: 36px; text-align:center; }
  .sch-rest { flex:1; padding-left:4px; }

  .swap-list { display: flex; flex-direction: column; gap: 6px; }
  .swap-row { display: flex; align-items: center; gap: 6px; background: #1e1e20; border-radius: 6px; padding: 6px 10px; }
  .swap-row input[type=color] { width: 34px; height: 28px; border: none; border-radius: 4px; cursor: pointer; background: none; padding: 0; flex-shrink:0; }
  .pick-btn { width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 4px; background: #111; cursor: pointer; font-size: 0.75rem; display: flex; align-items:center; justify-content:center; flex-shrink:0; transition: border-color 0.2s; }
  .pick-btn:hover, .pick-btn.active { border-color: var(--accent); background: rgba(255,106,0,0.1); }
  .swap-row .arrow { color: var(--muted); font-size: 0.8rem; flex-shrink:0; }
  .swap-row .right { display:flex; align-items:center; gap:5px; flex:1; min-width:0; }
  .swap-row input[type=text] { width: 60px; background: #111; border: 1px solid var(--border); color: var(--text); font-family: 'Space Mono', monospace; font-size: 0.66rem; outline: none; border-radius: 4px; padding: 4px 5px; flex-shrink:0; }
  .swap-row input[type=range] { flex:1; accent-color: var(--accent); min-width: 40px; }
  .swap-row .tol-val { font-size:0.6rem; color:var(--muted); width:24px; text-align:right; flex-shrink:0; }
  .swap-row .rm { cursor:pointer; color:var(--muted); font-size:0.9rem; flex-shrink:0; }
  .swap-row .rm:hover { color:#ff4444; }

  .swaps-footer { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  /* Results per card */
  .results-section { border-top: 1px solid var(--border); padding: 16px; }
  .results-section h3 { font-family: 'Syne', sans-serif; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 12px; }
  .result-grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .result-thumb { background: #1e1e20; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; width: 130px; flex-shrink:0; }
  .result-thumb img { width: 100%; display:block; image-rendering: pixelated; }
  .result-thumb .ti { padding: 6px 8px; }
  .result-thumb .tn { font-size: 0.58rem; color: var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .result-thumb .dl { margin-top:4px; width:100%; padding:4px; font-size:0.6rem; background:var(--accent); border:none; border-radius:3px; color:#000; font-family:'Space Mono',monospace; font-weight:700; cursor:pointer; }
  .result-thumb .dl:hover { background:var(--accent2); }

  #progressBar { width:100%; height:3px; background:var(--border); border-radius:2px; overflow:hidden; display:none; margin-bottom:8px; }
  #progressFill { height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width 0.1s; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<h1>BRAINROT RECOLORER</h1>
<p class="subtitle">Per-image color swaps — hover on image to pick colors, then recolor in bulk</p>

<div class="topbar">
  <div id="globalDropzone">
    <strong>🖼️ Drop textures here or click to browse</strong>
    <p>Each image gets its own color swap settings</p>
  </div>
  <input type="file" id="fileInput" multiple accept="image/*">
  <div style="display:flex;flex-direction:column;gap:8px">
    <button class="btn" id="recolorAllBtn" onclick="recolorAll()" disabled>▶ Recolor All</button>
    <button class="btn-sm" onclick="downloadAllZip()" id="dlAllBtn" style="display:none">⬇ ZIP All</button>
  </div>
</div>

<div id="progressBar"><div id="progressFill"></div></div>
<div id="imageCards"></div>
<canvas id="workCanvas" style="display:none"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
let imageEntries = []; // { file, id, swaps:[], results:[], imgEl, canvasEl }
let allResults = [];
let globalId = 0;
let activePicker = null; // { entryId, swapId }

// Setup dropzone
const dz = document.getElementById('globalDropzone');
const fi = document.getElementById('fileInput');
dz.addEventListener('click', () => fi.click());
fi.addEventListener('change', e => addFiles(Array.from(e.target.files)));
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('drag-over');
  addFiles(Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/')));
});

function addFiles(files) {
  files.forEach(f => {
    if (imageEntries.find(e => e.file.name === f.name)) return;
    const id = globalId++;
    const entry = { file: f, id, swaps: [], results: [] };
    imageEntries.push(entry);
    renderCard(entry);
    loadImageIntoEntry(entry);
  });
  updateGlobalBtns();
}

function loadImageIntoEntry(entry) {
  const img = new Image();
  img.onload = () => {
    entry.imgEl = img;
    const canvas = document.getElementById('preview_' + entry.id);
    const ctx = canvas.getContext('2d');
    // Fit to 240x240
    const scale = Math.min(240 / img.width, 240 / img.height, 1);
    canvas.width  = Math.round(img.width  * scale);
    canvas.height = Math.round(img.height * scale);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    entry.canvasEl = canvas;
    entry.scale = scale;
  };
  img.src = URL.createObjectURL(entry.file);
}

function renderCard(entry) {
  const card = document.createElement('div');
  card.className = 'img-card';
  card.id = 'card_' + entry.id;
  card.innerHTML = `
    <div class="img-card-header">
      <span class="fname">${entry.file.name}</span>
      <button class="btn-sm btn-danger" onclick="removeCard(${entry.id})">Remove</button>
    </div>
    <div class="img-card-body">
      <div class="preview-panel">
        <canvas id="preview_${entry.id}"></canvas>
        <div style="display:flex;gap:8px;align-items:center">
          <canvas class="zoom-box" id="zoom_${entry.id}" width="60" height="60"></canvas>
          <div>
            <div class="picked-color">
              <div class="picked-swatch" id="swatch_${entry.id}"></div>
              <span id="hexlabel_${entry.id}">hover image</span>
            </div>
            <div class="pick-hint" style="margin-top:4px">Click 🎯 on a swap<br>then click the image</div>
          </div>
        </div>
      </div>
      <div class="swaps-panel">
        <h3>Color Swaps</h3>
        <div class="swap-col-headers">
          <span class="sch-from">FROM</span><span class="sch-arr"></span>
          <span class="sch-to">TO</span>
          <span class="sch-rest">NAME &amp; TOLERANCE</span>
        </div>
        <div class="swap-list" id="swapList_${entry.id}"></div>
        <div class="swaps-footer">
          <button class="btn-sm" onclick="addSwap(${entry.id})">+ Add Swap</button>
          <button class="btn" style="padding:8px 14px;font-size:0.72rem" onclick="recolorOne(${entry.id})">Recolor This</button>
        </div>
      </div>
    </div>
    <div class="results-section" id="results_${entry.id}" style="display:none">
      <h3>Results</h3>
      <div class="result-grid" id="resultGrid_${entry.id}"></div>
    </div>`;
  document.getElementById('imageCards').appendChild(card);

  // Add a default swap
  addSwap(entry.id, '#3a9e4a', '#ff6a00', 'Orange', 80);

  // Setup canvas mouse events
  setTimeout(() => {
    const canvas = document.getElementById('preview_' + entry.id);
    canvas.addEventListener('mousemove', e => onCanvasMove(e, entry));
    canvas.addEventListener('click',     e => onCanvasClick(e, entry));
    canvas.addEventListener('mouseleave', () => {
      document.getElementById('hexlabel_' + entry.id).textContent = 'hover image';
    });
  }, 100);
}

let swapRowId = 0;
function addSwap(entryId, fromHex='#3a9e4a', toHex='#ff6a00', name='Swap', tol=80) {
  const entry = imageEntries.find(e => e.id === entryId);
  const sid = swapRowId++;
  entry.swaps.push({ sid, fromHex, toHex, name, tol });

  const list = document.getElementById('swapList_' + entryId);
  const row = document.createElement('div');
  row.className = 'swap-row';
  row.id = 'swaprow_' + sid;
  row.innerHTML = `
    <input type="color" value="${fromHex}" id="from_${sid}" title="Color to replace">
    <button class="pick-btn" id="pickbtn_${sid}" title="Click then click image to pick color" onclick="togglePicker(${entryId},${sid})">🎯</button>
    <span class="arrow">→</span>
    <input type="color" value="${toHex}" id="to_${sid}">
    <div class="right">
      <input type="text" value="${name}" id="name_${sid}" placeholder="Name">
      <input type="range" min="10" max="200" value="${tol}" id="tol_${sid}" oninput="document.getElementById('tv_${sid}').textContent=this.value">
      <span class="tol-val" id="tv_${sid}">${tol}</span>
    </div>
    <span class="rm" onclick="removeSwap(${entryId},${sid})">✕</span>`;
  list.appendChild(row);
}

function removeSwap(entryId, sid) {
  const entry = imageEntries.find(e => e.id === entryId);
  entry.swaps = entry.swaps.filter(s => s.sid !== sid);
  document.getElementById('swaprow_' + sid)?.remove();
  if (activePicker && activePicker.entryId === entryId && activePicker.sid === sid) activePicker = null;
}

function removeCard(entryId) {
  imageEntries = imageEntries.filter(e => e.id !== entryId);
  document.getElementById('card_' + entryId)?.remove();
  updateGlobalBtns();
}

function updateGlobalBtns() {
  document.getElementById('recolorAllBtn').disabled = imageEntries.length === 0;
}

// --- Eyedropper ---
function togglePicker(entryId, sid) {
  const btn = document.getElementById('pickbtn_' + sid);
  if (activePicker && activePicker.sid === sid) {
    // Deactivate
    activePicker = null;
    btn.classList.remove('active');
  } else {
    // Deactivate old
    if (activePicker) document.getElementById('pickbtn_' + activePicker.sid)?.classList.remove('active');
    activePicker = { entryId, sid };
    btn.classList.add('active');
  }
}

function getPixelFromCanvas(canvas, e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width  / rect.width;
  const scaleY = canvas.height / rect.height;
  const x = Math.floor((e.clientX - rect.left) * scaleX);
  const y = Math.floor((e.clientY - rect.top)  * scaleY);
  const ctx = canvas.getContext('2d');
  const px = ctx.getImageData(x, y, 1, 1).data;
  return { x, y, r: px[0], g: px[1], b: px[2], a: px[3] };
}

function rgbToHex(r,g,b) {
  return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
}

function onCanvasMove(e, entry) {
  const canvas = entry.canvasEl;
  if (!canvas) return;
  const { x, y, r, g, b, a } = getPixelFromCanvas(canvas, e);
  if (a < 10) return;
  const hex = rgbToHex(r,g,b);

  // Update swatch + label
  document.getElementById('swatch_' + entry.id).style.background = hex;
  document.getElementById('hexlabel_' + entry.id).textContent = hex;

  // Zoom magnifier
  const zoom = document.getElementById('zoom_' + entry.id);
  const zctx = zoom.getContext('2d');
  zctx.clearRect(0,0,60,60);
  zctx.imageSmoothingEnabled = false;
  zctx.drawImage(canvas, x-5, y-5, 10, 10, 0, 0, 60, 60);

  // Draw crosshair
  zctx.strokeStyle = 'rgba(255,255,255,0.8)';
  zctx.lineWidth = 1;
  zctx.beginPath(); zctx.moveTo(30,0); zctx.lineTo(30,60); zctx.stroke();
  zctx.beginPath(); zctx.moveTo(0,30); zctx.lineTo(60,30); zctx.stroke();
}

function onCanvasClick(e, entry) {
  if (!activePicker || activePicker.entryId !== entry.id) return;
  const canvas = entry.canvasEl;
  const { r, g, b, a } = getPixelFromCanvas(canvas, e);
  if (a < 10) return;
  const hex = rgbToHex(r,g,b);
  document.getElementById('from_' + activePicker.sid).value = hex;

  // Deactivate picker
  document.getElementById('pickbtn_' + activePicker.sid)?.classList.remove('active');
  activePicker = null;
}

// --- Recolor Engine ---
function hexToRgb(hex) {
  return { r: parseInt(hex.slice(1,3),16), g: parseInt(hex.slice(3,5),16), b: parseInt(hex.slice(5,7),16) };
}

function recolorImageData(imageData, fromHex, toHex, tolerance) {
  const from = hexToRgb(fromHex), to = hexToRgb(toHex);
  const d = new Uint8ClampedArray(imageData.data);
  for (let i = 0; i < d.length; i += 4) {
    if (d[i+3] < 10) continue;
    const r=d[i], g=d[i+1], b=d[i+2];
    if (r>210 && g>210 && b>210) continue; // skip near-white
    const dist = Math.sqrt((r-from.r)**2+(g-from.g)**2+(b-from.b)**2);
    if (dist <= tolerance) {
      const srcLuma = (from.r*0.299+from.g*0.587+from.b*0.114)||1;
      const pixLuma = r*0.299+g*0.587+b*0.114;
      const scale = pixLuma/srcLuma;
      d[i]   = Math.min(255,Math.round(to.r*scale));
      d[i+1] = Math.min(255,Math.round(to.g*scale));
      d[i+2] = Math.min(255,Math.round(to.b*scale));
    }
  }
  return new ImageData(d, imageData.width, imageData.height);
}

function getSwapsForEntry(entryId) {
  return entry => {
    const rows = document.querySelectorAll(`#swapList_${entryId} .swap-row`);
    return Array.from(rows).map(row => ({
      from: row.querySelector('input[type=color]').value,
      to:   row.querySelectorAll('input[type=color]')[1].value,
      name: row.querySelector('input[type=text]').value || 'swap',
      tol:  parseInt(row.querySelector('input[type=range]').value)
    }));
  };
}

function readSwaps(entryId) {
  const rows = document.querySelectorAll(`#swapList_${entryId} .swap-row`);
  return Array.from(rows).map(row => {
    const pickers = row.querySelectorAll('input[type=color]');
    return {
      from: pickers[0].value,
      to:   pickers[1].value,
      name: row.querySelector('input[type=text]').value || 'swap',
      tol:  parseInt(row.querySelector('input[type=range]').value)
    };
  });
}

async function recolorOne(entryId) {
  const entry = imageEntries.find(e => e.id === entryId);
  const swaps = readSwaps(entryId);
  if (!swaps.length || !entry.imgEl) return;

  entry.results = [];
  const grid = document.getElementById('resultGrid_' + entryId);
  grid.innerHTML = '';
  document.getElementById('results_' + entryId).style.display = 'block';

  const canvas = document.getElementById('workCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width  = entry.imgEl.width;
  canvas.height = entry.imgEl.height;

  for (const swap of swaps) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(entry.imgEl, 0, 0);
    let id = ctx.getImageData(0, 0, canvas.width, canvas.height);
    id = recolorImageData(id, swap.from, swap.to, swap.tol);
    ctx.putImageData(id, 0, 0);

    const dataUrl = canvas.toDataURL('image/png');
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    const baseName = entry.file.name.replace(/\.[^.]+$/, '');
    const filename = `${baseName}_${swap.name.replace(/\s+/g,'_')}.png`;

    entry.results.push({ filename, blob, dataUrl, colorHex: swap.to, colorName: swap.name });

    const thumb = document.createElement('div');
    thumb.className = 'result-thumb';
    const idx = entry.results.length - 1;
    thumb.innerHTML = `
      <img src="${dataUrl}" style="image-rendering:pixelated">
      <div class="ti">
        <div class="tn">${swap.name}</div>
        <button class="dl" onclick="dlOne(${entryId},${idx})">Download</button>
      </div>`;
    grid.appendChild(thumb);
    await new Promise(r => setTimeout(r, 0));
  }

  // Collect for ZIP
  rebuildAllResults();
  document.getElementById('dlAllBtn').style.display = 'block';
}

async function recolorAll() {
  for (const entry of imageEntries) await recolorOne(entry.id);
}

function rebuildAllResults() {
  allResults = imageEntries.flatMap(e => e.results || []);
}

function dlOne(entryId, idx) {
  const entry = imageEntries.find(e => e.id === entryId);
  const r = entry.results[idx];
  const a = document.createElement('a');
  a.href = URL.createObjectURL(r.blob);
  a.download = r.filename;
  a.click();
}

async function downloadAllZip() {
  rebuildAllResults();
  if (!allResults.length) return;
  const zip = new JSZip();
  allResults.forEach(r => zip.file(r.filename, r.blob));
  const blob = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'recolored_textures.zip';
  a.click();
}
</script>
</body>
</html>
